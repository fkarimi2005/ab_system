services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"          # наружу 5433, внутри сети остаётся 5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file:
      - .env
    environment:
      DB_HOST: postgres      # имя сервиса, а не localhost
      DB_PORT: "5432"        # внутренний порт, а не 5433
    ports:
      - "${APP_PORT:-8083}:${APP_PORT:-8083}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: